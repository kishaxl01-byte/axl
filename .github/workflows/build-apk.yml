name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            echo "package.json found in root. Running npm install..."
            npm install
          elif [ $(find . -name "package.json" -not -path "*/node_modules/*" | wc -l) -gt 0 ]; then
            TARGET_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
            echo "package.json found in $TARGET_DIR. Running npm install..."
            cd $TARGET_DIR && npm install
          else
            echo "No package.json found. Skipping Node dependency step."
          fi

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          # 1. Locate the true Android root directory containing settings.gradle
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            ROOT_DIR=$(dirname "$SETTINGS_FILE")
          else
            # Fallback to the top-most folder containing a build.gradle file
            ROOT_DIR=$(dirname $(find . -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/node_modules/*" | head -n 1))
          fi

          echo "Targeting Android root project directory: $ROOT_DIR"
          cd "$ROOT_DIR"

          # 2. Check for or generate gradlew at the project root level
          if [ ! -f "gradlew" ]; then
            echo "No gradlew wrapper found at project root. Generating wrapper..."
            gradle wrapper
          fi

          # 3. Build the debug APK
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 14
