name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found in root, proceeding..."
          fi

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Locate Android Project & Prepare Wrapper
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)

          if [ -n "$GRADLEW_PATH" ]; then
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew in: $GRADLE_DIR"
          else
            echo "gradlew not found. Searching for build.gradle..."
            BUILD_GRADLE_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
            
            if [ -n "$BUILD_GRADLE_PATH" ]; then
              DIR_NAME=$(dirname "$BUILD_GRADLE_PATH")
              if [ "$(basename "$DIR_NAME")" = "app" ]; then
                GRADLE_DIR=$(dirname "$DIR_NAME")
              else
                GRADLE_DIR="$DIR_NAME"
              fi
              echo "Found Android Gradle project at: $GRADLE_DIR"
              echo "Generating Gradle Wrapper..."
              cd "$GRADLE_DIR"
              gradle wrapper
              cd -
            else
              echo "ERROR: Neither 'gradlew' nor 'build.gradle' was found in your repository."
              echo "Please ensure your Android source files are committed and pushed to GitHub."
              exit 1
            fi
          fi

          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Inject Java 17 Compatibility
        run: |
          TARGET_GRADLE="${{ env.GRADLE_DIR }}/app/build.gradle"
          if [ -f "$TARGET_GRADLE" ]; then
            cat << 'EOF' >> "$TARGET_GRADLE"

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
            echo "Updated $TARGET_GRADLE"
          elif [ -f "${{ env.GRADLE_DIR }}/build.gradle" ]; then
            cat << 'EOF' >> "${{ env.GRADLE_DIR }}/build.gradle"

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                          kotlinOptions {
                              jvmTarget = '17'
                          }
                      }
                  }
              }
          }
          EOF
            echo "Updated ${{ env.GRADLE_DIR }}/build.gradle"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x "${{ env.GRADLE_DIR }}/gradlew"

      - name: Build Android APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 14
