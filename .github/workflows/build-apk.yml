name: Build Application (APK)

on:
  push:
    branches:
      - main # Triggers on pushes to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      - name: Smart Install Dependencies
        # This automatically searches all folders for package.json
        run: |
          PKG_JSON=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PKG_JSON" ]; then
            echo "❌ ERROR: No package.json file exists anywhere in this GitHub repository."
            echo "You must upload your app's source code to GitHub before trying to build it."
            exit 1
          fi
          
          DIR=$(dirname "$PKG_JSON")
          echo "✅ Found package.json in directory: $DIR"
          cd "$DIR"
          npm install

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' 

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Smart Build Android APK
        # This automatically searches all folders for the Android project
        run: |
          BUILD_GRADLE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_GRADLE" ]; then
            echo "❌ ERROR: No Android project (build.gradle) found in this repository."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_GRADLE")
          echo "✅ Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: '**/build/outputs/apk/release/*.apk'
