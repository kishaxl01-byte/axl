name: Build Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the source code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies
      # NOTE: If your package.json is inside a subfolder (e.g., 'frontend' or 'app'),
      # uncomment the 'working-directory' line below and set the correct folder name.
      - name: Install dependencies
        # working-directory: ./YOUR_SUBFOLDER_NAME
        run: npm install --legacy-peer-deps

      # Step 4: Run tests (if defined in package.json)
      - name: Run tests
        # working-directory: ./YOUR_SUBFOLDER_NAME
        run: npm test --if-present

      # Step 5: Build application (if defined in package.json)
      - name: Build app
        # working-directory: ./YOUR_SUBFOLDER_NAME
        run: npm run build --if-present
