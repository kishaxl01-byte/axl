name: Build StudyFlow APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper exists with compatible version
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper with Gradle 8.7..."
            gradle wrapper --gradle-version 8.7
          fi

      - name: Create dummy google-services.json if missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Creating dummy google-services.json..."
            mkdir -p app
            echo '{
              "project_info": {
                "project_number": "123456789012",
                "project_id": "dummy-project",
                "storage_bucket": "dummy-project.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789012:android:1234567890123456789012",
                    "android_client_info": {
                      "package_name": "com.example"
                    }
                  },
                  "oauth_client": [],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }' > app/google-services.json
          fi

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Xvfb (Virtual Framebuffer)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build APK with Gradle under Xvfb
        run: xvfb-run ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
