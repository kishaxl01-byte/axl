name: Build Application (APK)

on:
  push:
    branches:
      - main # Triggers on pushes to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Adjust to your project's required Node version

      - name: Install dependencies
        run: npm install

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Android builds typically require Java 11 or 17

      - name: Build Android APK
        # Navigates to the android folder and runs the Gradle build command
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          # Standard path for React Native/Capacitor release APKs
          path: android/app/build/outputs/apk/release/app-release.apk
