name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            echo "package.json found in root. Running npm install..."
            npm install
          elif [ $(find . -name "package.json" -not -path "*/node_modules/*" | wc -l) -gt 0 ]; then
            TARGET_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
            echo "package.json found in $TARGET_DIR. Running npm install..."
            cd $TARGET_DIR && npm install
          else
            echo "No package.json found. Skipping Node dependency step."
          fi

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          # 1. Look for existing gradlew wrapper anywhere in the repository
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$GRADLEW_PATH" ]; then
            DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew wrapper at $GRADLEW_PATH. Navigating to $DIR..."
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            # 2. If gradlew is missing, locate build.gradle and auto-generate the wrapper
            BUILD_GRADLE=$(find . -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/node_modules/*" | head -n 1)
            
            if [ -n "$BUILD_GRADLE" ]; then
              DIR=$(dirname "$BUILD_GRADLE")
              echo "No gradlew wrapper found. Found build file at $BUILD_GRADLE."
              echo "Generating Gradle wrapper in $DIR..."
              cd "$DIR"
              gradle wrapper
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "Error: No Gradle build files found in the repository."
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 14
