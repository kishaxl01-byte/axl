name: Build and Test App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install dependencies (works even if package-lock.json is missing)
      - name: Install dependencies
        run: npm install

      # Step 4: Run tests (optional, safely skips if no tests exist)
      - name: Run tests
        run: npm test -- --passWithNoTests

      # Step 5: Build the app
      - name: Build app
        run: npm run build

      # Step 6: Save the output folder as an artifact
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            build/
            dist/
          retention-days: 7
