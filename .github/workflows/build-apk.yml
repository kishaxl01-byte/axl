name: Build Application (APK)

on:
  push:
    branches:
      - main # Triggers on pushes to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Standard for modern Android builds

      - name: Make gradlew executable and Build APK
        # This tells the step to run inside the 'android' folder where gradlew lives
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          # Standard path for frameworks where the android project is nested
          path: android/app/build/outputs/apk/release/*.apk
